# MultiMER — conda environment
#
#   conda env create -f environment.yml && conda activate multimer
#
# Versions are the ones the submitted system was run with. Install the pytorch
# build matching your CUDA version if the default channel resolution does not
# pick a GPU build.
name: multimer
channels:
  - conda-forge
dependencies:
  - python>=3.9
  - pip
  - pip:
      - torch>=2.8.0
      - transformers>=4.57.6
      - accelerate>=1.10.1
      - peft>=0.17.1
      - bitsandbytes>=0.48.2
      - safetensors>=0.7.0
      - sentencepiece>=0.2.1
      - numpy>=2.0.2
      - pandas>=2.3.3
      - tqdm>=4.67.3
      - opencv-python>=5.0.0.93
      - pillow>=11.3.0
      - soundfile>=0.12.1
      - openai>=2.30.0
      - anthropic>=0.113.0
      - requests>=2.32.5
